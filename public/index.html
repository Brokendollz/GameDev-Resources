<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק Platformer 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        canvas {
            border: 3px solid #0096ff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.5);
            background: #000;
            display: block;
            max-width: 100%;
        }
        .info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0096ff;
            color: #fff;
            font-size: 13px;
            z-index: 100;
        }
        .info h3 { color: #00d4ff; margin-bottom: 8px; }
        .info p { margin: 4px 0; color: #aaa; }
        .info strong { color: #00ff88; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div class="info">
        <h3>🎮 Platformer 2D</h3>
        <p><strong>A/D</strong> - תנועה</p>
        <p><strong>Space</strong> - קפיצה</p>
        <p><strong>R</strong> - ריסט</p>
        <p>ניקוד: <span id="score">0</span></p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRAVITY = 800, FRICTION = 0.95;
        let score = 0, gameOver = false;

        class Player {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 30; this.height = 50;
                this.velocityX = 0; this.velocityY = 0;
                this.jumpPower = 400; this.moveSpeed = 250;
                this.isJumping = false;
            }
            update(dt, platforms) {
                this.velocityY += GRAVITY * dt;
                this.velocityX *= FRICTION;
                this.x += this.velocityX * dt;
                this.y += this.velocityY * dt;
                let onGround = false;
                for (let p of platforms) {
                    if (this.velocityY >= 0 && this.y + this.height >= p.y &&
                        this.y + this.height <= p.y + 15 && this.x + this.width > p.x &&
                        this.x < p.x + p.width) {
                        this.y = p.y - this.height; this.velocityY = 0; onGround = true;
                    }
                }
                if ((this.keys['Space'] || this.keys['w'] || this.keys['ArrowUp']) && onGround && !this.isJumping) {
                    this.isJumping = true; this.velocityY = -this.jumpPower;
                }
                if (!this.keys['Space'] && !this.keys['w'] && !this.keys['ArrowUp']) this.isJumping = false;
                if (this.keys['a'] || this.keys['ArrowLeft']) this.velocityX = -this.moveSpeed;
                if (this.keys['d'] || this.keys['ArrowRight']) this.velocityX = this.moveSpeed;
                if (this.y > 1500) gameOver = true;
            }
            draw(ctx) {
                ctx.fillStyle = '#4080ff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#0050aa';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Platform {
            constructor(x, y, w, h = 20, color = '#3d8a3d') {
                this.x = x; this.y = y; this.width = w; this.height = h; this.color = color;
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Enemy {
            constructor(x, y, distance = 150, speed = 100) {
                this.x = x; this.y = y; this.width = 25; this.height = 25;
                this.startX = x; this.distance = distance; this.speed = speed;
                this.direction = 1; this.velocityY = 0;
            }
            update(dt, platforms) {
                this.velocityY += GRAVITY * dt;
                this.x += this.speed * this.direction * dt;
                this.y += this.velocityY * dt;
                for (let p of platforms) {
                    if (this.velocityY >= 0 && this.y + this.height >= p.y &&
                        this.y + this.height <= p.y + 15 && this.x + this.width > p.x &&
                        this.x < p.x + p.width) {
                        this.y = p.y - this.height; this.velocityY = 0;
                    }
                }
                if (Math.abs(this.x - this.startX) > this.distance) this.direction *= -1;
            }
            draw(ctx) {
                ctx.fillStyle = '#cc3333';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Collectible {
            constructor(x, y, value = 10) {
                this.x = x; this.y = y; this.originalY = y;
                this.width = 15; this.height = 15; this.value = value;
                this.time = 0; this.collected = false;
            }
            update(dt, player) {
                this.time += dt;
                this.y = this.originalY + Math.sin(this.time * 3) * 5;
                if (!this.collected && player.x < this.x + this.width &&
                    player.x + player.width > this.x && player.y < this.y + this.height &&
                    player.y + player.height > this.y) {
                    this.collected = true;
                    score += this.value;
                    document.getElementById('score').textContent = score;
                }
            }
            draw(ctx) {
                if (!this.collected) {
                    ctx.fillStyle = '#ffdd00';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.strokeStyle = '#ff9900'; ctx.lineWidth = 2;
                    ctx.strokeRect(this.x, this.y, this.width, this.height);
                }
            }
        }

        const platforms = [new Platform(0, 1360, 2400, 40, '#2d6a2d')];
        for (let i = 0; i < 8; i++) {
            platforms.push(new Platform(150 + i * 250, 1280 - i * 60, 120, 20));
        }
        platforms.push(new Platform(1550, 1220, 200, 20));

        const player = new Player(100, 1280);
        player.keys = {};
        const enemies = [new Enemy(700, 1310, 200, 120), new Enemy(1700, 1200, 200, 120), new Enemy(1880, 1200, 200, 120)];
        const collectibles = [new Collectible(230, 1250, 10), new Collectible(480, 1190, 10), new Collectible(730, 1130, 10),
            new Collectible(1080, 910, 15), new Collectible(1380, 810, 15), new Collectible(1730, 950, 20), new Collectible(1980, 1250, 25)];
        let camera = { x: 0, y: 0 };

        window.addEventListener('keydown', (e) => { player.keys[e.key] = true; if (e.key.toLowerCase() === 'r') location.reload(); });
        window.addEventListener('keyup', (e) => { player.keys[e.key] = false; });

        let lastTime = 0;
        function gameLoop(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.016);
            lastTime = currentTime;
            if (!gameOver) {
                player.update(dt, platforms);
                enemies.forEach(e => e.update(dt, platforms));
                collectibles.forEach(c => c.update(dt, player));
                enemies.forEach(e => {
                    if (player.x < e.x + e.width && player.x + player.width > e.x &&
                        player.y < e.y + e.height && player.y + player.height > e.y) {
                        player.velocityY = -350;
                    }
                });
                camera.x = Math.max(0, Math.min(player.x - 300, 2400 - 1280));
                camera.y = Math.max(0, Math.min(player.y - 200, 1400 - 720));
            }
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-camera.x, -camera.y);
            platforms.forEach(p => p.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            collectibles.forEach(c => c.draw(ctx));
            player.draw(ctx);
            ctx.restore();
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText('ניקוד: ' + score, canvas.width / 2, canvas.height / 2 + 50);
            }
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
