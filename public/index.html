<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק Platformer 2D</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        #game-container {
            max-width: 1280px;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.5);
            overflow: hidden;
        }
        .info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0096ff;
            font-size: 13px;
            z-index: 100;
        }
        .info h3 { color: #00d4ff; margin-bottom: 8px; font-size: 14px; }
        .info p { margin: 4px 0; color: #aaa; }
        .info strong { color: #00ff88; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div class="info">
        <h3>🎮 Platformer 2D</h3>
        <p><strong>A/D</strong> - תנועה</p>
        <p><strong>Space</strong> - קפיצה</p>
        <p><strong>R</strong> - ריסט</p>
        <p>ניקוד: <span id="score">0</span></p>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 800 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player, platforms, enemies, collectibles, movingPlatforms;
        let score = 0;
        let keys = {};
        let gameOver = false;

        function preload() {}

        function create() {
            this.physics.world.setBounds(0, 0, 2400, 1400);
            this.cameras.main.setBounds(0, 0, 2400, 1400);
            this.cameras.main.setBackgroundColor('#0a0a1a');

            // Create groups
            platforms = this.physics.add.staticGroup();
            movingPlatforms = this.physics.add.group();
            enemies = this.physics.add.group();
            collectibles = this.physics.add.group();

            // Ground
            let ground = platforms.create(1200, 1360, null);
            ground.setScale(120, 2);
            ground.body.setImmovable(true);
            ground.setFillStyle(0x2d6a2d);
            ground.isRectangle = true;

            // Static platforms
            const staticPlatforms = [
                [150, 1280, 8, 1],
                [400, 1220, 8, 1],
                [650, 1160, 8, 1],
                [900, 1100, 8, 1],
                [1550, 1220, 15, 1],
                [1950, 1280, 4, 1],
                [2080, 1230, 4, 1],
                [2210, 1180, 4, 1]
            ];

            staticPlatforms.forEach(([x, y, w, h]) => {
                let p = platforms.create(x, y, null);
                p.setScale(w, h);
                p.body.setImmovable(true);
                p.setFillStyle(0x3d8a3d);
                p.isRectangle = true;
            });

            // Moving platforms
            [[1000, 950], [1300, 850]].forEach(([x, y]) => {
                let p = movingPlatforms.create(x, y, null);
                p.setScale(7.5, 1);
                p.body.setAllowGravity(false);
                p.body.setImmovable(true);
                p.setFillStyle(0x6464aa);
                p.isRectangle = true;
                p.moveStart = x;
                p.moveDistance = 200;
                p.moveSpeed = 150;
                p.direction = 1;
            });

            // Player
            player = this.physics.add.sprite(120, 1280, null);
            player.setBounce(0.1);
            player.isJumping = false;
            player.jumpCharge = 0;
            player.moveSpeed = 280;
            player.jumpPower = 420;
            player.maxJumpPower = 520;
            player.setFillStyle(0x4080ff);
            player.setScale(2, 2.6);
            player.isRectangle = true;

            // Enemies
            [{x: 700, y: 1310}, {x: 1700, y: 1200}, {x: 1880, y: 1200}].forEach(e => {
                let en = enemies.create(e.x, e.y, null);
                en.setFillStyle(0xcc3333);
                en.setScale(1.7, 1.7);
                en.isRectangle = true;
                en.patrolStart = e.x;
                en.patrolDistance = 200;
                en.moveSpeed = 120;
                en.direction = 1;
            });

            // Collectibles
            [{x: 230, y: 1250, v: 10}, {x: 480, y: 1190, v: 10}, {x: 730, y: 1130, v: 10},
             {x: 1080, y: 910, v: 15}, {x: 1380, y: 810, v: 15}, {x: 1730, y: 950, v: 20}, {x: 1980, y: 1250, v: 25}
            ].forEach(c => {
                let item = collectibles.create(c.x, c.y, null);
                item.body.setAllowGravity(false);
                item.setFillStyle(0xffdd00);
                item.setScale(1.1, 1.1);
                item.isRectangle = true;
                item.value = c.v;
                item.originalY = c.y;
                item.bobTime = Math.random() * 6;
            });

            // Colliders
            this.physics.add.collider(player, platforms);
            this.physics.add.collider(player, movingPlatforms);
            this.physics.add.collider(enemies, platforms);
            this.physics.add.overlap(player, collectibles, (p, c) => {
                score += c.value;
                document.getElementById('score').textContent = score;
                c.destroy();
            });
            this.physics.add.overlap(player, enemies, () => {
                player.setVelocityY(-350);
            });

            this.cameras.main.startFollow(player, true, 0.1, 0.1);

            keys = this.input.keyboard.createCursorKeys();
            keys.a = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
            keys.d = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
            keys.w = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W);
            keys.r = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
            keys.space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

            this.scene = this;
        }

        function update() {
            if (gameOver) return;

            if (player.y > 1480) {
                gameOver = true;
                alert('GAME OVER! ניקוד: ' + score);
                location.reload();
                return;
            }

            if (keys.r.isDown) {
                location.reload();
                return;
            }

            player.setVelocityX(0);
            if (keys.a.isDown || keys.left.isDown) player.setVelocityX(-player.moveSpeed);
            if (keys.d.isDown || keys.right.isDown) player.setVelocityX(player.moveSpeed);

            const onGround = player.body.touching.down || player.body.blocked.down;
            if ((keys.space.isDown || keys.w.isDown || keys.up.isDown) && onGround && !player.isJumping) {
                player.isJumping = true;
                player.jumpCharge = player.jumpPower;
            }
            if (player.isJumping && onGround) {
                player.setVelocityY(-player.jumpCharge);
                player.isJumping = false;
            }

            movingPlatforms.children.entries.forEach(p => {
                p.x += p.moveSpeed * p.direction * (1 / 60);
                p.body.reset(p.x, p.y);
                if (Math.abs(p.x - p.moveStart) > p.moveDistance) p.direction *= -1;
            });

            enemies.children.entries.forEach(e => {
                e.setVelocityX(e.moveSpeed * e.direction);
                if (Math.abs(e.x - e.patrolStart) > e.patrolDistance) e.direction *= -1;
            });

            collectibles.children.entries.forEach(c => {
                c.bobTime += 1 / 60;
                c.y = c.originalY + Math.sin(c.bobTime * 3) * 6;
            });
        }

        // Override default rectangle rendering
        Phaser.GameObjects.Rectangle.prototype.render = function(renderer) {
            if (this.isRectangle) {
                const ctx = renderer.gameContext;
                ctx.fillStyle = '#' + this.fillColor.toString(16).padStart(6, '0');
                ctx.fillRect(
                    this.getTopLeft().x,
                    this.getTopLeft().y,
                    this.width,
                    this.height
                );
            } else {
                Phaser.GameObjects.Rectangle.prototype.constructor.prototype.render.call(this, renderer);
            }
        };
    </script>
</body>
</html>
